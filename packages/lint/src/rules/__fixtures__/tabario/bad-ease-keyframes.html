<!doctype html>
<html>
  <head>
    <title>eases the register bans, hidden in keyframes</title>
    <meta
      name="tabario-project"
      content='{"schema":1,"template_id":"punchy_creator","brand_profile_id":null,"compiler_version":"1.0.0","policies":{"motion":{"transitions":{"primary":"circle_iris","accents":[]},"durations":{"fast":0.2,"medium":0.4,"slow":0.6},"allowed_eases":["power2.out","power3.out","power1.inOut","none"],"bans":["no overshoot past 1.04"],"brand_kit_override":null},"strong_transition_limit":2}}'
    />
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="3">
      <div
        class="clip"
        data-composition-id="scene-1"
        data-composition-src="compositions/scene-1.html"
        data-start="0"
        data-duration="3"
        data-transition-type="circle_iris"
      ></div>
      <h1 id="title">A banned ease one level down</h1>
      <ul>
        <li class="item">one</li>
        <li class="item">two</li>
      </ul>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        tl.to(
          "#title",
          {
            keyframes: {
              "0%": { scale: 1 },
              "60%": { scale: 1.08, ease: "back.out(2)" },
              "100%": { scale: 1 },
            },
            duration: 0.6,
          },
          0,
        );
        tl.to(
          ".item",
          {
            keyframes: { "0%": { opacity: 0 }, "100%": { opacity: 1 } },
            duration: 0.4,
            easeEach: "elastic.out(1, 0.3)",
          },
          0.6,
        );
        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
