<!doctype html>
<html>
  <head>
    <title>accent ceiling written at the template schema's path, not the tag's</title>
    <meta
      name="tabario-project"
      content='{"schema":1,"template_id":"punchy_creator","brand_profile_id":null,"compiler_version":"1.0.0","policies":{"motion":{"transitions":{"primary":"circle_iris","accents":["slide","zoom_blur"]},"durations":{"fast":0.2,"medium":0.4,"slow":0.6},"allowed_eases":["power2.out","power3.out","power1.inOut","none"],"bans":["no idle motion"],"brand_kit_override":null},"transitions":{"strong_transition_limit":2}}}'
    />
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="4">
      <div
        class="clip"
        data-composition-id="scene-1"
        data-composition-src="compositions/scene-1.html"
        data-start="0"
        data-duration="1"
        data-transition-type="slide"
      ></div>
      <div
        class="clip"
        data-composition-id="scene-2"
        data-composition-src="compositions/scene-2.html"
        data-start="1"
        data-duration="1"
        data-transition-type="slide"
      ></div>
      <div
        class="clip"
        data-composition-id="scene-3"
        data-composition-src="compositions/scene-3.html"
        data-start="2"
        data-duration="1"
        data-transition-type="slide"
      ></div>
      <div
        class="clip"
        data-composition-id="scene-4"
        data-composition-src="compositions/scene-4.html"
        data-start="3"
        data-duration="1"
      ></div>
      <h1 id="title">Three accents, and the ceiling is where the reader cannot see it</h1>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        tl.to("#title", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
        window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
