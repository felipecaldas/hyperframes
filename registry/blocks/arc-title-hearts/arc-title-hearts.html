    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #101014;
      }

      /* Stand-in for your own footage — the card is an overlay, so replace this
         with a <video> or delete it and mount the card over an existing scene. */
      .arc-demo-backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 34%, #3a3f52 0%, #101014 70%);
      }

      /* A true per-letter arc, not a whole-line tilt: both lines bow upward
           like a gentle rainbow, each letter rotated to stay tangent to the
           curve. .hf-arc-line is a zero-size anchor at left:50% that every
           .hf-arc-char positions itself against — an arbitrary curve is not
           expressible in a handful of static rules the way a flat line is. */
      /* White on a heavy black outline, deliberately un-tokenised (TAB-721).
           This pairing is the mechanic's legibility device, not a brand choice:
           the card floats over arbitrary presenter footage, and the outline is
           what keeps it readable against a bright wall and dark hair in the same
           frame. Bound to --brand-primary/--brand-ink it rendered cyan-on-cyan
           for the first client that used it. The typeface and the accent stay
           brand-driven; the contrast pair does not. */
      .hf-arc-line {
        position: absolute;
        inset: 0;
        z-index: 22;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 64px;
        line-height: 1;
        color: #fff;
        -webkit-text-stroke: 5px #000;
        paint-order: stroke fill;
      }
      .hf-arc-char {
        position: absolute;
        white-space: nowrap;
      }
      .hf-arc-glyph {
        display: inline-block;
      }
      .hf-arc-heart {
        position: absolute;
        top: 14%;
        width: 34px;
        height: 31px;
        z-index: 23;
        transform-origin: 50% 100%;
      }
    </style>
  </head>
